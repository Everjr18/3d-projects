<!DOCTYPE html>
<html lang="es" data-theme="forest">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="public/css/style.css" />
    <title>Editor de Skin Minecraft - Pixel Art</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      .editor-container {
        display: flex;
        width: 100vw;
        height: 100vh;
      }

      .left-panel {
        width: 600px;
        background: #1a1a1a;
        display: flex;
        flex-direction: column;
        border-right: 2px solid #333;
      }

      .canvas-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2a2a2a;
        position: relative;
      }

      #skin-canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        cursor: crosshair;
        border: 2px solid #444;
      }

      .tools-bar {
        display: flex;
        gap: 8px;
        padding: 12px;
        background: #1a1a1a;
        border-bottom: 1px solid #333;
      }

      .tool-btn {
        width: 40px;
        height: 40px;
        border: 2px solid #444;
        background: #2a2a2a;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        transition: all 0.2s;
      }

      .tool-btn:hover {
        background: #3a3a3a;
        border-color: #666;
      }

      .tool-btn.active {
        background: #4a90e2;
        border-color: #6ab0ff;
      }

      .color-panel {
        padding: 12px;
        background: #1a1a1a;
        border-bottom: 1px solid #333;
      }

      .color-display {
        width: 100%;
        height: 60px;
        border: 2px solid #444;
        border-radius: 4px;
        margin-bottom: 8px;
      }

      .color-inputs {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .color-inputs input[type="color"] {
        width: 60px;
        height: 40px;
        border: none;
        cursor: pointer;
      }

      .color-inputs input[type="text"] {
        flex: 1;
        height: 40px;
        background: #2a2a2a;
        border: 1px solid #444;
        color: white;
        padding: 0 8px;
        font-family: monospace;
      }

      .layer-toggle {
        padding: 12px;
        background: #1a1a1a;
        border-bottom: 1px solid #333;
        display: flex;
        gap: 8px;
      }

      .layer-btn {
        flex: 1;
        height: 40px;
        background: #2a2a2a;
        border: 2px solid #444;
        color: white;
        cursor: pointer;
        transition: all 0.2s;
      }

      .layer-btn.active {
        background: #4a90e2;
        border-color: #6ab0ff;
      }

      .right-panel {
        flex: 1;
        background: #1a1a1a;
        display: flex;
        flex-direction: column;
      }

      .preview-3d {
        flex: 1;
        position: relative;
      }

      .controls-panel {
        height: 200px;
        background: #2a2a2a;
        border-top: 2px solid #333;
        padding: 16px;
        overflow-y: auto;
      }

      .action-buttons {
        padding: 12px;
        background: #1a1a1a;
        border-top: 1px solid #333;
        display: flex;
        gap: 8px;
      }

      .action-btn {
        flex: 1;
        height: 44px;
        border: none;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s;
      }

      .btn-import {
        background: #4a90e2;
        color: white;
      }

      .btn-export {
        background: #5cb85c;
        color: white;
      }

      .btn-import:hover {
        background: #5aa0f2;
      }

      .btn-export:hover {
        background: #6cc86c;
      }

      .zoom-controls {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 4px;
      }

      .zoom-btn {
        width: 32px;
        height: 32px;
        background: #2a2a2a;
        border: 1px solid #444;
        color: white;
        cursor: pointer;
        font-weight: bold;
      }

      .zoom-btn:hover {
        background: #3a3a3a;
      }

      .grid-toggle {
        position: absolute;
        top: 12px;
        left: 12px;
      }

      .grid-toggle input {
        margin-right: 4px;
      }

      .grid-toggle label {
        color: white;
        font-size: 12px;
        background: #2a2a2aaa;
        padding: 8px 12px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="editor-container">
      <!-- Left Panel: 2D Canvas Editor -->
      <div class="left-panel">
        <!-- Tools -->
        <div class="tools-bar">
          <button class="tool-btn active" id="tool-pencil" title="Pencil (B)">✏️</button>
          <button class="tool-btn" id="tool-eraser" title="Eraser (E)">🧹</button>
          <button class="tool-btn" id="tool-fill" title="Fill (F)">🪣</button>
          <button class="tool-btn" id="tool-eyedropper" title="Eyedropper (I)">💧</button>
          <div style="flex: 1"></div>
          <button class="tool-btn" id="btn-undo" title="Undo (Ctrl+Z)">↶</button>
          <button class="tool-btn" id="btn-redo" title="Redo (Ctrl+Y)">↷</button>
        </div>

        <!-- Color Picker -->
        <div class="color-panel">
          <div class="color-display" id="color-display"></div>
          <div class="color-inputs">
            <input type="color" id="color-picker" value="#ffdbac" />
            <input type="text" id="color-hex" value="#ffdbac" placeholder="#RRGGBB" />
            <label style="color: white; font-size: 12px;">
              Alpha: <input type="range" id="alpha-slider" min="0" max="255" value="255" style="width: 100px;" />
              <span id="alpha-value">255</span>
            </label>
          </div>
        </div>

        <!-- Layer Toggle -->
        <div class="layer-toggle">
          <button class="layer-btn active" id="layer-body">Base Layer</button>
          <button class="layer-btn" id="layer-outer">Outer Layer</button>
        </div>

        <!-- Canvas -->
        <div class="canvas-container">
          <div class="grid-toggle">
            <label>
              <input type="checkbox" id="show-grid" checked />
              Show Grid
            </label>
          </div>
          <div class="zoom-controls">
            <button class="zoom-btn" id="zoom-out">-</button>
            <button class="zoom-btn" id="zoom-in">+</button>
          </div>
          <canvas id="skin-canvas" width="512" height="512"></canvas>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
          <button class="action-btn btn-import" id="btn-import">📁 Import PNG</button>
          <button class="action-btn btn-export" id="btn-export">💾 Export PNG</button>
        </div>
      </div>

      <!-- Right Panel: 3D Preview -->
      <div class="right-panel">
        <div class="preview-3d" id="preview-3d"></div>
        <div class="controls-panel">
          <h3 style="color: white; margin: 0 0 12px 0; font-size: 14px;">3D Preview Controls</h3>

          <label style="color: white; font-size: 12px; display: block; margin-bottom: 8px;">
            <input type="checkbox" id="auto-rotate" checked /> Auto Rotate
          </label>

          <label style="color: white; font-size: 12px; display: block; margin-bottom: 8px;">
            <input type="checkbox" id="show-outer-layer" checked /> Show Outer Layer
          </label>

          <label style="color: white; font-size: 12px; display: block; margin-bottom: 8px;">
            <input type="checkbox" id="walk-animation" /> Walking Animation
          </label>

          <div style="margin-top: 16px;">
            <a href="/" style="color: #4a90e2; text-decoration: none; font-size: 12px;">← Back to Home</a>
          </div>
        </div>
      </div>
    </div>

    <input type="file" id="file-input" accept="image/png" style="display: none;" />

    <script type="module" src="/public/js/minecraft-skin-editor.ts"></script>
  </body>
</html>
